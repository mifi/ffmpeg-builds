name: Mirror BtbN release

# Mirrors the gpl-shared builds of one FFmpeg release branch from https://github.com/BtbN/FFmpeg-Builds
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'FFmpeg release branch, e.g. 8.1'
        required: true
      release:
        description: 'Release number, the tag will be <version>-<release>'
        required: true
        default: '1'

permissions:
  contents: write

defaults:
  run:
    shell: bash # enables pipefail

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      V: ${{ inputs.version }}
      TAG: ${{ inputs.version }}-${{ inputs.release }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download and verify
        run: |
          [[ $TAG =~ ^[0-9]+\.[0-9]+-[0-9]+$ ]] || { echo "::error::Invalid version or release: $TAG"; exit 1; }
          mkdir assets && cd assets
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          files=(ffmpeg-n$V-latest-{linux64-gpl-shared-$V.tar.xz,win64-gpl-shared-$V.zip,winarm64-gpl-shared-$V.zip})
          for f in "${files[@]}"; do curl -fsSLO "$base/$f"; done
          curl -fsSL -o ../checksums.sha256 "$base/checksums.sha256"
          # verify exactly our files
          for f in "${files[@]}"; do grep -E "^[0-9a-f]{64} [ *]$f$" ../checksums.sha256 || { echo "::error::$f is not in checksums.sha256" >&2; exit 1; }; done > ../ours.sha256
          sha256sum --strict -c ../ours.sha256

      - name: Get version
        run: |
          tar -xf assets/ffmpeg-n$V-latest-linux64-gpl-shared-$V.tar.xz -C "$RUNNER_TEMP"
          # no LD_LIBRARY_PATH: this also checks that the RPATH finds the libs (see #1)
          "$RUNNER_TEMP/ffmpeg-n$V-latest-linux64-gpl-shared-$V/bin/ffmpeg" -version | head -1 | cut -d' ' -f3 | tee version.txt

      - name: Create release
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Mirror of BtbN/FFmpeg-Builds (ffmpeg $(cat version.txt))" \
            assets/*
